<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- UTS simplified shield logo -->
  <rect x="20" y="10" width="80" height="100" rx="8" fill="currentColor" opacity="0.08"/>
  <rect x="20" y="10" width="80" height="100" rx="8" stroke="currentColor" stroke-width="2" opacity="0.25"/>
  <!-- Tower/building icon -->
  <rect x="50" y="30" width="20" height="50" rx="2" fill="currentColor" opacity="0.2"/>
  <rect x="42" y="50" width="36" height="30" rx="2" fill="currentColor" opacity="0.15"/>
  <rect x="55" y="22" width="10" height="12" rx="1" fill="currentColor" opacity="0.25"/>
  <!-- UTS text -->
  <text x="60" y="100" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="currentColor" opacity="0.5">UTS</text>
</svg>
